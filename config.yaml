global:
  homeassistant:
    url: "http://192.168.218.1:8123"  # Token is read from the HA_TOKEN env var

  # input_boolean: the controller only makes changes while this is on
  automatic_ventilation_switch: "input_boolean.automatische_ventilatie"

  # Fan entity that sets the global ventilation speed (percentage)
  ventilation_speed_entity: "fan.open_air_mini_e0e308_open_air_mini"

  # Baseline airflow (%), also keeps the humidity readings representative
  minimum_fan_speed: 30

  # Outside air adjustment: weather entity with temperature + humidity attributes.
  # A room's target is never set below the RH outside air reaches at room
  # temperature (plus margin), since ventilating can't dry a room beyond that.
  # Remove outside_weather_entity to always use the base targets.
  outside_weather_entity: "weather.forecast_home"
  outside_humidity_margin: 5  # Extra % RH above what outside air can reach
  max_target_humidity: 80     # Upper limit for a raised target (%)

# Per room: demand = max(0, (humidity - target_humidity) * multiplier)
rooms:
  bathroom:
    humidity_sensor: "sensor.open_air_2_badkamer_open_air_2_badkamer_humidity"
    temperature_sensor: "sensor.open_air_2_badkamer_open_air_2_badkamer_temperature"  # Optional
    valve_entity: "valve.open_air_2_badkamer_open_air_2_badkamer_valve"
    humidity_curve:
      target_humidity: 60   # Base target (%)
      multiplier: 5.0       # Higher = more aggressive response
    valve:
      min_opening: 10         # Opening when no room has demand (%)
      restricted_opening: 10  # Opening when capacity is needed elsewhere (%)

  living_room:
    humidity_sensor: "sensor.open_air_5_woonkamer_open_air_5_woonkamer_humidity"
    temperature_sensor: "sensor.open_air_5_woonkamer_open_air_5_woonkamer_temperature"
    valve_entity: "valve.open_air_5_woonkamer_open_air_5_woonkamer_valve"
    humidity_curve:
      target_humidity: 65
      multiplier: 2.0
    valve:
      min_opening: 10
      restricted_opening: 0

  bathroom_2:
    humidity_sensor: "sensor.open_air_3_badkamer_2_open_air_3_badkamer_2_humidity"
    temperature_sensor: "sensor.open_air_3_badkamer_2_open_air_3_badkamer_2_temperature"
    valve_entity: "valve.open_air_3_badkamer_2_open_air_3_badkamer_2_valve"
    humidity_curve:
      target_humidity: 60
      multiplier: 5.0
    valve:
      min_opening: 10
      restricted_opening: 0

  guestroom:
    humidity_sensor: "sensor.open_air_1_zolder_open_air_1_zolder_humidity"
    temperature_sensor: "sensor.open_air_1_zolder_open_air_1_zolder_temperature"
    valve_entity: "valve.open_air_1_zolder_open_air_1_zolder_valve"
    humidity_curve:
      target_humidity: 60
      multiplier: 2.0
    valve:
      min_opening: 10
      restricted_opening: 0

  toilet:
    humidity_sensor: "sensor.open_air_4_toilet_open_air_4_toilet_humidity"
    temperature_sensor: "sensor.open_air_4_toilet_open_air_4_toilet_temperature"
    valve_entity: "valve.open_air_4_toilet_open_air_4_toilet_valve"
    humidity_curve:
      target_humidity: 60
      multiplier: 1.0
    valve:
      min_opening: 10
      restricted_opening: 0
